    caption: ARPANET の地図（1977 年）
    source:
      source_url: https://commons.wikimedia.org/wiki/File:Arpanet_logical_map,_march_1977.png
      license: PD
      author: ARPANET（Computer History Museum 所蔵の資料）
      modifications: none
  - id: slide-fiber
    type: image
    src: images/network-map/fiber.jpg
    caption: 光ファイバの中を進むレーザーの光（写真は切り抜き・縮小）
    source:
      source_url: https://commons.wikimedia.org/wiki/File:Optical_patchcord.jpg
      license: CC-BY-4.0
      author: Sunmosk
      modifications: 切り抜き・縮小
  - id: slide-means
    type: custom
    component: CompareTable
    props:
      title: 通信手段の使い分け
      columns: [主な使い道, 特徴]
      rows:
        - label: 光ファイバ
          cells: [家や会社の回線・海底ケーブル, 光で信号を送る線]
        - label: 携帯電話
          cells: [スマホ（4G・5G）, 電話会社の電波]
        - label: 無線 LAN
          cells: [家・学校・駅やお店, Wi-Fi のこと]
        - label: Bluetooth
          cells: [イヤホン・マウス, 近くの機器と]
        - label: LPWA
          cells: [IoT のセンサ, 遅いが遠く・省電力]
  - id: slide-lanwan
    type: bullets
    title: LAN・WAN・インターネット
    items:
      - "**LAN**：学校や家など、限られた範囲のネットワーク"
      - "**WAN**：離れた LAN どうしをつなぐ、広い範囲のネットワーク"
      - "**インターネット**：LAN や WAN が世界中でつながったもの"
  - id: slide-ipv4
    type: image
    src: images/network-map/04-ipv4.png
    caption: IPv4 は 32 ビット（IPv6 は 128 ビット）
    source:
      source_url: self
      license: self
      author: この授業の補助資料の図
      modifications: none
  - id: slide-local-global
    type: image
    src: images/network-map/05-local-global.png
    caption: ローカル IP アドレスとグローバル IP アドレス
    source:
      source_url: self
      license: self
      author: この授業の補助資料の図
      modifications: none
  - id: slide-dns
    type: bullets
    title: 名前から番号へ：DNS
    items:
      - "**ドメイン名**：人が覚えやすい名前"
      - "**DNS**：名前を IP アドレスに直す（スマホの連絡先と同じ考え方）"
      - ブラウザは DNS に番号を聞いてから、相手と通信する
  - id: slide-url
    type: bullets
    title: URL を読む（https://www.○○○.go.jp/about/）
    items:
      - "**https**：スキーム名（どの約束事で通信するか）"
      - "**www.○○○.go.jp**：ドメイン名（右から読む。jp＝日本、go＝政府機関）"
      - "**/about/**：パス名（どのページか）"
  - id: slide-layers
    type: image
    src: images/network-map/06-tcpip-layers.png
    caption: TCP/IP の 4 つの層
    source:
      source_url: self
      license: self
      author: この授業の補助資料の図
      modifications: none
  - id: slide-tcp-udp
    type: custom
    component: CompareTable
    props:
      title: トランスポート層の 2 つのやり方
      columns: [TCP, UDP]
      rows:
        - label: しくみ
          cells: [届いたか確かめ、送り直す, 確かめない・送り直さない]
        - label: よい点
          cells: [確実に届く, 遅れが少ない]
        - label: 使う所
          cells: [Web・メール, 音声通話・ビデオ通話]
  - id: slide-app
    type: bullets
    title: アプリケーション層の例
    items:
      - "**HTTP**：Web を見る（**HTTPS** は暗号化したもの）"
      - "**SMTP** でメールを送り、**POP** か **IMAP** で受け取る"
      - 鍵マークがあっても偽サイトのことがある → ドメイン名も見る
  - id: slide-home
    type: image
    src: images/network-map/07-home-network.png
    caption: 家のネットワーク機器の並び
    source:
      source_url: self
      license: self
      author: この授業の補助資料の図
      modifications: none
  - id: slide-wifi
    type: bullets
    title: つなぐ設定と、無線 LAN の安全
    items:
      - "**DHCP**：つないだ機器に IP アドレスを自動で配る"
      - "**SSID**（名前）とパスワードでつなぐ。暗号化は **WPA2 か WPA3**（**WEP は使わない**）"
      - 無料の Wi-Fi には偽物もある。大事な情報は入力しない
  - id: slide-summary
    type: bullets
    title: まとめ
    items:
      - データは**パケット**に分けて運ばれ、**ルータ**が道を選ぶ
      - 住所（**IP アドレス**）と名前（**ドメイン名**）を **DNS** がつなぐ
      - 約束事（**プロトコル**）は層に分かれ、家の機器もその上で動く
  - id: slide-next
    type: bullets
    title: このあとやること
    items:
      - 教科書 p.148〜151 と補助資料（4 ページ）を読む
      - 復習問題を解く（通信速度の計算は補助資料 6、パリティは教科書 p.162〜163 の実習 14）
      - 問 21 は、自分の端末の設定画面で IP アドレスを見る

