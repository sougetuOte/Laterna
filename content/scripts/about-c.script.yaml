    title: AI の時代に、手で書いて学ぶ理由
    items:
      - "**頼み方が具体的になる**：仕組みを知っていれば、何をどう頼むかが分かる"
      - "**ツッコミを入れられる**：AI が取り違えたとき、読めて書ければ気づける"
      - 最低限の読み書きと知識は、AI を使いこなすための道具
  - id: slide-summary
    type: bullets
    title: まとめ
    items:
      - C は、**機械の中身に手が届き、人にも読める**言語
      - UNIX のために生まれ、今も**マイコン・OS・AI の裏側**で働く
      - 来年・再来年の授業と、**AI を使いこなす力**につながる

